<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Inter, Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120a1f"/><stop offset="1" stop-color="#1d1030"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1845"/><stop offset="1" stop-color="#201238"/></linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ah" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5b942"/></marker>
<marker id="ahd" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b9a6e6"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="800" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#f5b942">How StudyDungeon connects</text>
<text x="800" y="96" text-anchor="middle" font-size="18" fill="#d9cff5">Browser to database, with AI used only when a student uploads notes</text>

<!-- Browser -->
<g filter="url(#glow)"><rect x="30" y="140" width="300" height="500" rx="18" fill="url(#card)" stroke="#f5b942" stroke-opacity="0.45" stroke-width="1.5"/></g>
<text x="52" y="184" font-size="24" font-weight="700" fill="#f5b942">Browser</text>
<g font-size="17" fill="#d9cff5">
<text x="52" y="228">React 19 app</text><text x="52" y="252" font-size="14" fill="#b9a6e6">login, upload, scorecard, memories</text>
<text x="52" y="300">Phaser 3 game canvas</text><text x="52" y="324" font-size="14" fill="#b9a6e6">rooms, monsters, combat animation</text>
<text x="52" y="372">Bundled offline demo</text><text x="52" y="396" font-size="14" fill="#b9a6e6">used if the backend is asleep</text><text x="52" y="416" font-size="14" fill="#b9a6e6">for more than 8 s</text>
</g>
<text x="52" y="600" font-size="14" fill="#b9a6e6">No AI keys in the browser</text>

<!-- Vercel -->
<g filter="url(#glow)"><rect x="460" y="140" width="230" height="500" rx="18" fill="url(#card)" stroke="#f5b942" stroke-opacity="0.45" stroke-width="1.5"/></g>
<text x="482" y="184" font-size="24" font-weight="700" fill="#f5b942">Vercel</text>
<g font-size="17" fill="#d9cff5">
<text x="482" y="228">Static hosting</text><text x="482" y="252" font-size="14" fill="#b9a6e6">built React bundle</text>
<text x="482" y="300">Rewrite rule</text><text x="482" y="324" font-size="14" fill="#b9a6e6">/api/* to Render</text><text x="482" y="344" font-size="14" fill="#b9a6e6">/api prefix removed</text>
</g>

<!-- Render -->
<g filter="url(#glow)"><rect x="820" y="140" width="370" height="500" rx="18" fill="url(#card)" stroke="#f5b942" stroke-opacity="0.45" stroke-width="1.5"/></g>
<text x="842" y="184" font-size="24" font-weight="700" fill="#f5b942">Render (Docker)</text>
<text x="842" y="214" font-size="17" fill="#d9cff5">FastAPI backend</text>
<text x="842" y="248" font-size="14" font-weight="700" fill="#f5b942">API routers</text>
<text x="842" y="270" font-size="14" fill="#d9cff5">auth · documents · dungeons · runs</text>
<text x="842" y="290" font-size="14" fill="#d9cff5">progress · leaderboard · packs · health</text>
<text x="842" y="328" font-size="14" font-weight="700" fill="#f5b942">Services</text>
<text x="842" y="350" font-size="14" fill="#d9cff5">ingestion · combat</text>
<text x="842" y="370" font-size="14" fill="#d9cff5">spaced repetition · scoring</text>
<text x="842" y="408" font-size="14" font-weight="700" fill="#f5b942">Security</text>
<text x="842" y="430" font-size="14" fill="#d9cff5">Argon2 · signed cookies</text>
<text x="842" y="450" font-size="14" fill="#d9cff5">rate limits · per-user scoping</text>
<text x="842" y="488" font-size="14" font-weight="700" fill="#f5b942">Data layer</text>
<text x="842" y="510" font-size="14" fill="#d9cff5">SQLAlchemy async</text>
<text x="842" y="530" font-size="14" fill="#d9cff5">Alembic migrations run on start</text>

<!-- Supabase -->
<g filter="url(#glow)"><rect x="1320" y="140" width="250" height="500" rx="18" fill="url(#card)" stroke="#f5b942" stroke-opacity="0.45" stroke-width="1.5"/></g>
<text x="1342" y="184" font-size="24" font-weight="700" fill="#f5b942">Supabase</text>
<text x="1342" y="214" font-size="17" fill="#d9cff5">PostgreSQL</text>
<g font-size="15" fill="#d9cff5">
<text x="1342" y="260">users</text><text x="1342" y="288">documents</text><text x="1342" y="316">chunks</text><text x="1342" y="344">topics</text><text x="1342" y="372">questions</text><text x="1342" y="400">dungeons</text><text x="1342" y="428">runs</text><text x="1342" y="456">attempts</text><text x="1342" y="484">reviews</text>
</g>

<!-- main arrows -->
<g stroke="#f5b942" stroke-width="3" fill="none">
<line x1="330" y1="390" x2="458" y2="390" marker-end="url(#ah)"/>
<line x1="690" y1="390" x2="818" y2="390" marker-end="url(#ah)"/>
<line x1="1190" y1="390" x2="1318" y2="390" marker-end="url(#ah)"/>
</g>
<g font-size="13" fill="#f5b942" text-anchor="middle">
<text x="394" y="300">HTTPS</text><text x="394" y="318">same origin</text><text x="394" y="336">HttpOnly</text><text x="394" y="354">session</text><text x="394" y="372">cookie</text>
<text x="754" y="350">proxied</text><text x="754" y="368">request</text>
<text x="1254" y="300">SQL over</text><text x="1254" y="318">SSL</text><text x="1254" y="336">(session</text>
</g>
<text x="1254" y="354" font-size="13" fill="#f5b942" text-anchor="middle">pooler)</text>

<!-- Gemini -->
<g filter="url(#glow)"><rect x="960" y="710" width="330" height="90" rx="18" fill="url(#card)" stroke="#b9a6e6" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="6 5"/></g>
<text x="1125" y="746" text-anchor="middle" font-size="20" font-weight="700" fill="#f5b942">Gemini (primary)</text>
<text x="1125" y="776" text-anchor="middle" font-size="17" fill="#d9cff5">OpenRouter (fallback)</text>
<line x1="1125" y1="640" x2="1125" y2="708" stroke="#b9a6e6" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ahd)"/>
<text x="1140" y="682" font-size="14" fill="#b9a6e6">uploads only</text>

<!-- Uptime -->
<g filter="url(#glow)"><rect x="460" y="710" width="230" height="90" rx="18" fill="url(#card)" stroke="#b9a6e6" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="6 5"/></g>
<text x="575" y="762" text-anchor="middle" font-size="20" font-weight="700" fill="#f5b942">UptimeRobot</text>
<path d="M690,755 H860 V642" stroke="#b9a6e6" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#ahd)"/>
<text x="775" y="745" text-anchor="middle" font-size="14" fill="#b9a6e6">/health every 5 min</text>

<text x="800" y="876" text-anchor="middle" font-size="14" fill="#b9a6e6">StudyDungeon · built with Kiro</text>
</svg>


services:
  - type: web
    name: studydungeon-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: FRONTEND_ORIGIN
        sync: false
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: DEMO_RATE_LIMIT_PER_HOUR
        value: "60"
      - key: DEMO_GUEST_TTL_HOURS
        value: "24"
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: OPENROUTER_ENABLED
        value: "false"

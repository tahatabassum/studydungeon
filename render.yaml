services:
  - type: web
    name: studydungeon-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      # Secrets: set in the Render dashboard
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      # Plain values
      - key: COOKIE_SECURE
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OPENROUTER_ENABLED
        value: "false"
      # Vercel rewrite hop + Render proxy hop. Verify after deploy.
      - key: TRUSTED_PROXY_COUNT
        value: "2"
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: DEMO_RATE_LIMIT_PER_HOUR
        value: "60"
      - key: DEMO_GUEST_TTL_HOURS
        value: "24"
